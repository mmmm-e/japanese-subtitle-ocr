[package]
name = "japanese-subtitle-ocr"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Windows desktop studio for Japanese video subtitle OCR, review, and ASS/SRT export"

[dependencies]
anyhow = "1"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[dependencies.rodio]
version = '0.20.1'
default-features = false

[dependencies.unicode-normalization]
version = '0.1.26'
